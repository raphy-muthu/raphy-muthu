<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t">
  <title id="t">Raphael Muthu, illustrated</title>
  <style>
    /* ── Edit these to match yourself ───────────────────────────── */
    .skin       { fill: #B57C55; }   /* skin tone */
    .fingers    { stroke: #B57C55; }  /* same as skin tone */
    .skin-shade { fill: #9C6844; }   /* slightly darker skin, for ears and neck */
    .hair       { fill: #16151A; }   /* hair color */
    .curl       { stroke: #34333F; }   /* curl highlights */
    .brow       { stroke: #16151A; }
    .top        { fill: #2F343C; }   /* quarter-zip color */
    .top-dk     { fill: #22262C; }   /* collar and cuff shade */
    .sleeve     { stroke: #2F343C; } /* same as quarter-zip color */
    .zip        { stroke: #C3C8CF; } /* zipper */
    .tee        { fill: #F3F4F6; }   /* white tee under the collar */
    .glasses    { display: none; }   /* change to "inline" to add glasses */
    /* ──────────────────────────────────────────────────────────── */

    .character { animation: bob 4s ease-in-out infinite; }
    .eyes      { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .arm       { animation: wave 3.6s ease-in-out infinite; transform-box: view-box; transform-origin: 284px 330px; }
    .chip      { animation: float 5s ease-in-out infinite; }
    .atom      { animation: float 6s ease-in-out infinite reverse; }
    .orbits    { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes wave  { 0%,55%,100% { transform: rotate(0); } 10%,30% { transform: rotate(-16deg); } 20%,40% { transform: rotate(8deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes spin  { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .character, .eyes, .arm, .chip, .atom, .orbits { animation: none; }
    }
  </style>

